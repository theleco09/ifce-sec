<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos participantes - SEC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-light bg-secondary">
        <div class="container">
            <a class="navbar-brand" href="/">
                Semana Esportiva e Cultural IFCE
            </a>
        </div>
    </nav>

    <header class="bg-success text-center p-5">
        <h1>Cursos participantes</h1>
        <p>Acompanhe os cursos que participam da SEC!</p>
    </header>

    <main class="container my-5">
        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h3>INFO</h3>
                    <p>Informática</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h3>MECA</h3>
                    <p>Mecânica</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h3>TELE</h3>
                    <p>Telecomunicações</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h3>QUÍMICA</h3>
                    <p>Química</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h3>ELETRO</h3>
                    <p>Eletrotécnica</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <h3>EDI</h3>
                    <p>Edificações</p>
                </div>
            </div>

        </div>

        <div class="text-center mt-5">
            <a href="/" class="btn btn-success">Voltar ao início</a>
        </div>
    </main>

    <footer class="bg-secondary text-center py-3">
        <p class="mb-0">Semana Esportiva e Cultural — IFCE</p>
    </footer>
</body>

</html>
